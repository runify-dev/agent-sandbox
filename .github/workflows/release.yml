name: Release

# 推送 v* 标签时构建 amd64 + arm64 镜像并发布到 GHCR：
#   ghcr.io/<owner>/agent-sandbox-server:<version> / latest
#   ghcr.io/<owner>/agent-sandbox-runtime:<version> / latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-sandbox-server
            context: .
          - image: agent-sandbox-runtime
            context: ./runtime
    steps:
      - uses: actions/checkout@v5

      # runtime 镜像的 arm64 版本通过 QEMU 模拟构建，比 amd64 慢很多；server 镜像是交叉编译，不受影响
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
